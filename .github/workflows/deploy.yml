name: Quality gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build with Next.js
        run: npm run build

      - name: Verify static export
        run: npm run verify:export

      - name: Verify structure, hub links and new directories
        run: node scripts/verify-structure.mjs --batch 3

      - name: Upload verified static export
        uses: actions/upload-artifact@v7
        with:
          name: roboskin-static-export
          path: out
          retention-days: 7

  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the production server runtime
        env:
          ROBOSKIN_RUNTIME: server
        run: npm run build

      - name: Verify generated public Markdown against this server build
        run: node scripts/verify-server-markdown.mjs

      - name: Verify real server 404 indexing metadata
        run: node scripts/verify-not-found-server.mjs

      - name: Upload server Markdown verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roboskin-server-markdown-verification
          path: .artifacts/server-markdown-verification.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, verify-server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Wait for the existing Vercel deployment and verify production
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-structure-production.mjs
      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roboskin-structure-production-verification
          path: |
            .artifacts/production-verification.json
            docs/seo/structure-20261030
          include-hidden-files: true
          retention-days: 30
