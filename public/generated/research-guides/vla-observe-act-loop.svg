<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc"><title id="title">Observe → interpret → act</title><desc id="desc">A policy connects perception and language to physical commands.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9e7b"/></marker><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#203249" stroke-width="1" opacity=".45"/></pattern></defs><rect width="1200" height="720" fill="#080e18"/><rect width="1200" height="720" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="68" fill="#ffb99f" font-size="22" letter-spacing="3">ROBOSKIN / RESEARCH EXPLAINED</text><text x="54" y="127" fill="#f6f3ed" font-size="43" font-weight="700">Observe → interpret → act</text><text x="54" y="175" fill="#afbdce" font-size="25" >A policy connects perception and language to physical commands.</text><rect x="54" y="233" width="300" height="120" rx="18" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="78" y="284" fill="#f6f3ed" font-size="30" font-weight="700">Camera + prompt</text><text x="78" y="327" fill="#dbe3ef" font-size="25" >Scene + instruction</text><rect x="450" y="233" width="285" height="120" rx="18" fill="#312219" stroke="#ff9e7b" stroke-width="2"/><text x="474" y="284" fill="#f6f3ed" font-size="34" font-weight="700">VLA policy</text><text x="474" y="327" fill="#dbe3ef" font-size="25" >Condition an action</text><rect x="829" y="233" width="317" height="120" rx="18" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="853" y="284" fill="#f6f3ed" font-size="34" font-weight="700">Robot action</text><text x="853" y="327" fill="#dbe3ef" font-size="25" >Execute a command</text><path d="M354 293H436" fill="none" stroke="#ff9e7b" stroke-width="5"  marker-end="url(#arrow)"/><path d="M735 293H815" fill="none" stroke="#ff9e7b" stroke-width="5"  marker-end="url(#arrow)"/><rect x="340" y="454" width="520" height="120" rx="18" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="364" y="505" fill="#f6f3ed" font-size="34" font-weight="700">Observe the physical result</text><text x="364" y="548" fill="#dbe3ef" font-size="25" >New image, robot state, optional touch</text><path d="M984 353V514H874" fill="none" stroke="#ff9e7b" stroke-width="5"  marker-end="url(#arrow)"/><path d="M340 514H202V367" fill="none" stroke="#ff9e7b" stroke-width="5"  marker-end="url(#arrow)"/><text x="475" y="400" fill="#ffb99f" font-size="25" >Model-specific interfaces</text><text x="54" y="677" fill="#afbdce" font-size="20" letter-spacing="2">CONCEPTUAL DIAGRAM · NOT AN EXPERIMENTAL RESULT</text></g></svg>
