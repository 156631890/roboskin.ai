<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc"><title id="title">Plan a sequence; keep observing</title><desc id="desc">An action chunk can extend beyond the commands already executed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9e7b"/></marker><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#203249" stroke-width="1" opacity=".45"/></pattern></defs><rect width="1200" height="720" fill="#080e18"/><rect width="1200" height="720" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="68" fill="#ffb99f" font-size="22" letter-spacing="3">ROBOSKIN / RESEARCH EXPLAINED</text><text x="54" y="127" fill="#f6f3ed" font-size="43" font-weight="700">Plan a sequence; keep observing</text><text x="54" y="175" fill="#afbdce" font-size="25" >An action chunk can extend beyond the commands already executed.</text><text x="55" y="260" fill="#ffb99f" font-size="23" letter-spacing="2">PLANNED CHUNK</text><rect x="54" y="289" width="164" height="104" rx="12" fill="#653b29" stroke="#ff9e7b" stroke-width="2"/><text x="98" y="355" fill="#f6f3ed" font-size="38" >a1</text><rect x="237" y="289" width="164" height="104" rx="12" fill="#653b29" stroke="#ff9e7b" stroke-width="2"/><text x="281" y="355" fill="#f6f3ed" font-size="38" >a2</text><rect x="420" y="289" width="164" height="104" rx="12" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="464" y="355" fill="#f6f3ed" font-size="38" >a3</text><rect x="603" y="289" width="164" height="104" rx="12" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="647" y="355" fill="#f6f3ed" font-size="38" >a4</text><rect x="786" y="289" width="164" height="104" rx="12" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="830" y="355" fill="#f6f3ed" font-size="38" >a5</text><rect x="969" y="289" width="164" height="104" rx="12" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="1013" y="355" fill="#f6f3ed" font-size="38" >a6</text><text x="73" y="435" fill="#dbe3ef" font-size="28" >Executed prefix</text><text x="470" y="435" fill="#dbe3ef" font-size="28" >Remaining predicted actions</text><rect x="54" y="493" width="355" height="121" rx="18" fill="#121d2d" stroke="#536a84" stroke-width="2"/><text x="78" y="544" fill="#f6f3ed" font-size="34" font-weight="700">Fresh observation</text><text x="78" y="587" fill="#dbe3ef" font-size="25" >Contact may change plans</text><rect x="569" y="493" width="578" height="121" rx="18" fill="#312219" stroke="#ff9e7b" stroke-width="2"/><text x="593" y="544" fill="#f6f3ed" font-size="34" font-weight="700">Update remaining commands</text><text x="593" y="587" fill="#dbe3ef" font-size="25" >Policy + controller determine the timing</text><path d="M409 554H555" fill="none" stroke="#ff9e7b" stroke-width="5"  marker-end="url(#arrow)"/><path d="M849 493V453" fill="none" stroke="#ff9e7b" stroke-width="5" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="54" y="677" fill="#afbdce" font-size="20" letter-spacing="2">CONCEPTUAL DIAGRAM · NOT AN EXPERIMENTAL RESULT</text></g></svg>
