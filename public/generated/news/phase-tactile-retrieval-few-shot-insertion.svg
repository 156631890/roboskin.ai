e-linecap="round" stroke-linejoin="round"/><text x="861" y="452" fill="#ffddca" font-size="20">Four target demos per shape</text><path d="M60 548h1080" stroke="#49535c"/><text x="62" y="594" fill="#f3f0e9" font-size="24">77% normal starts • 47% unseen starts • 100 trials per method</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.30889v1. Original explanatory schematic.</text></g></svg>
