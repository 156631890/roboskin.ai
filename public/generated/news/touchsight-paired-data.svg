<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="49" font-weight="bold">TwinTouch-20H: what the hours mean</text><text x="62" y="190" fill="#abb5bd" font-size="27">Paired appearances share one set of tactile measurements</text><rect x="60" y="244" width="502" height="239" rx="12" fill="#1d272f" stroke="#59636c"/><text x="91" y="322" fill="#f19a75" font-size="66" font-weight="bold">10 hours</text><text x="91" y="379" fill="#f3f0e9" font-size="33">Original glove video</text><text x="91" y="427" fill="#abb5bd" font-size="27">Physically recorded</text><text x="584" y="373" fill="#f19a75" font-size="46">+</text><rect x="638" y="244" width="502" height="239" rx="12" fill="#283b41" stroke="#59636c"/><text x="669" y="322" fill="#f19a75" font-size="66" font-weight="bold">10 hours</text><text x="669" y="379" fill="#f3f0e9" font-size="31">Generated bare-hand video</text><text x="669" y="427" fill="#abb5bd" font-size="27">Appearance changed; labels reused</text><rect x="60" y="510" width="1080" height="68" rx="10" fill="#4e3027"/><text x="600" y="555" text-anchor="middle" fill="#ffddca" font-size="31">20 visual hours, not 20 independent hours of touch collection</text><path d="M 60 602 H 1140" stroke="#49535c"/><text x="62" y="640" fill="#a6afb7" font-size="22">Source: TouchSight v1, Section III. Original RoboSkin.ai explanatory diagram.</text></g></svg>