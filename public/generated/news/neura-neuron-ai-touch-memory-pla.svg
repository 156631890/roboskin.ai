    <g fill="#f4f1e9" font-size="21" font-weight="700"><text x="80" y="530">Task success</text><text x="354" y="530">Contact force</text><text x="628" y="530">Loop latency</text><text x="902" y="530">Memory limits</text></g>
    <g fill="#aeb8bf" font-size="17"><text x="80" y="557">Include failures + interventions</text><text x="354" y="557">Track peaks + safe stops</text><text x="628" y="557">Report median + tail</text><text x="902" y="557">Test occlusion + reset</text></g>
