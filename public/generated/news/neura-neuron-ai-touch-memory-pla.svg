<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Neuron AI: multisensory claims and the evidence needed</title>
  <desc id="desc">A conceptual map of sensor observations, temporal context and robot action, followed by four evaluation questions. This is an editorial illustration, not a disclosed Neuron AI architecture.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#69d6cf" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#10161c"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="57" fill="#69d6cf" font-size="19" letter-spacing="3">ROBOSKIN.AI / EVIDENCE REVIEW</text>
    <text x="60" y="119" fill="#f4f1e9" font-size="43" font-weight="700">Touch, sound and memory</text>
    <text x="62" y="159" fill="#aeb8bf" font-size="23">Neuron AI · public claims, testable questions</text>
    <rect x="60" y="201" width="315" height="233" rx="15" fill="#213139"/>
    <text x="84" y="238" fill="#69d6cf" font-size="18" letter-spacing="1.3">OBSERVATIONS</text>
    <circle cx="91" cy="276" r="5" fill="#69d6cf"/><text x="109" y="283" fill="#f1f5f5" font-size="21">3D vision</text>
    <circle cx="91" cy="313" r="5" fill="#69d6cf"/><text x="109" y="320" fill="#f1f5f5" font-size="21">Touch + force</text>
    <circle cx="91" cy="350" r="5" fill="#69d6cf"/><text x="109" y="357" fill="#f1f5f5" font-size="21">Audio + robot state</text>
    <circle cx="91" cy="387" r="5" fill="#69d6cf"/><text x="109" y="394" fill="#f1f5f5" font-size="21">Language</text>
    <path d="M383 316H425" stroke="#69d6cf" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="440" y="201" width="320" height="233" rx="15" fill="#294149"/>
    <text x="464" y="238" fill="#69d6cf" font-size="18" letter-spacing="1.3">TEMPORAL CONTEXT</text>
    <rect x="465" y="268" width="58" height="54" rx="6" fill="#426169"/>
    <rect x="537" y="268" width="58" height="54" rx="6" fill="#537d84"/>
    <rect x="609" y="268" width="58" height="54" rx="6" fill="#69d6cf"/>
    <path d="M465 341H667" stroke="#7e9da4" stroke-width="2"/>
    <text x="465" y="379" fill="#f1f5f5" font-size="21">Retain prior evidence</text>
    <text x="465" y="409" fill="#b8c9ce" font-size="17">Memory does not prove learning</text>
    <path d="M768 316H810" stroke="#69d6cf" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="825" y="201" width="315" height="233" rx="15" fill="#3f3028"/>
    <text x="850" y="238" fill="#e9b995" font-size="18" letter-spacing="1.3">PHYSICAL ACTION</text>
    <path d="M866 337L907 291L959 321L983 294" fill="none" stroke="#f4f1e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="907" cy="291" r="11" fill="#69d6cf"/>
    <path d="M980 285L1012 290L1005 313" fill="none" stroke="#69d6cf" stroke-width="6" stroke-linecap="round"/>
    <rect x="1030" y="290" width="66" height="44" rx="6" fill="#715846" stroke="#e9b995" stroke-width="2"/>
    <text x="850" y="379" fill="#f1f5f5" font-size="21">Contact · recovery</text>
    <text x="850" y="409" fill="#d1bbab" font-size="17">Measure outcomes over attempts</text>
    <text x="62" y="480" fill="#aeb8bf" font-size="17" letter-spacing="1.7">EVIDENCE STILL NEEDED</text>
