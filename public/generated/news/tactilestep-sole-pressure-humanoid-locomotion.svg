<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="139" fill="#f3f0e9" font-size="45" font-weight="bold">Touch under every step</text><text x="62" y="184" fill="#abb5bd" font-size="25">TactileStep closes the loop with sole-pressure features</text><rect x="60" y="246" width="318" height="236" rx="14" fill="#22333b"/><text x="90" y="294" fill="#f19a75" font-size="21">PRESSURE INSOLE</text><rect x="140" y="325" width="158" height="92" rx="42" fill="#f3f0e9"/><g fill="#f19a75"><circle cx="178" cy="350" r="9"/><circle cx="216" cy="350" r="9"/><circle cx="254" cy="350" r="9"/><circle cx="178" cy="388" r="9"/><circle cx="216" cy="388" r="9"/><circle cx="254" cy="388" r="9"/></g><text x="94" y="451" fill="#b8c2c9" font-size="20">60 simulated taxels / foot</text><path d="M378 365 H442" stroke="#f19a75" stroke-width="5"/><path d="M442 365 l-18-12 v24z" fill="#f19a75"/><rect x="452" y="246" width="306" height="236" rx="14" fill="#283b41"/><text x="484" y="294" fill="#f19a75" font-size="21">CONTACT FEATURES</text><text x="488" y="352" fill="#f3f0e9" font-size="28" font-weight="bold">Force</text><text x="488" y="392" fill="#f3f0e9" font-size="28" font-weight="bold">Center of pressure</text><text x="488" y="432" fill="#f3f0e9" font-size="28" font-weight="bold">Contact area</text><path d="M758 365 H820" stroke="#f19a75" stroke-width="5"/><path d="M820 365 l-18-12 v24z" fill="#f19a75"/><rect x="830" y="246" width="310" height="236" rx="14" fill="#4e3027"/><text x="860" y="294" fill="#ffddca" font-size="21">HARDWARE RESULT</text><text x="860" y="361" fill="#f3f0e9" font-size="39" font-weight="bold">−48.8%</text><text x="860" y="401" fill="#ffddca" font-size="21">peak force, best condition</text><text x="860" y="440" fill="#ffddca" font-size="21">20 samples / condition</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">25 Hz tactile feedback improves contact quality—with energy trade-offs.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.28959v1. Original explanatory schematic.</text></g></svg>
