<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="43" font-weight="bold">One sensor separates pressure from tackiness</text><text x="62" y="189" fill="#abb5bd" font-size="26">A soft magnet crosses a stable Hall-effect baseline</text><rect x="60" y="246" width="330" height="250" rx="16" fill="#22333b"/><text x="91" y="291" fill="#f19a75" font-size="20">COMPRESSION</text><path d="M110 345 Q225 415 340 345" fill="none" stroke="#f19a75" stroke-width="12"/><rect x="178" y="386" width="94" height="30" rx="12" fill="#f3f0e9"/><rect x="188" y="447" width="74" height="18" rx="8" fill="#718089"/><path d="M225 310 V365" stroke="#ffddca" stroke-width="8"/><path d="M210 348 L225 368 L240 348" fill="none" stroke="#ffddca" stroke-width="8"/><text x="91" y="478" fill="#b8c2c9" font-size="18">magnet moves toward Hall sensor</text><rect x="435" y="246" width="330" height="250" rx="16" fill="#283b41"/><text x="466" y="291" fill="#f19a75" font-size="20">PULL-OFF</text><path d="M485 385 Q600 315 715 385" fill="none" stroke="#f19a75" stroke-width="12"/><rect x="553" y="347" width="94" height="30" rx="12" fill="#f3f0e9"/><rect x="563" y="447" width="74" height="18" rx="8" fill="#718089"/><path d="M600 412 V357" stroke="#ffddca" stroke-width="8"/><path d="M585 374 L600 354 L615 374" fill="none" stroke="#ffddca" stroke-width="8"/><text x="466" y="478" fill="#b8c2c9" font-size="18">magnet moves away from Hall sensor</text><rect x="810" y="246" width="330" height="250" rx="16" fill="#4e3027"/><text x="841" y="291" fill="#ffddca" font-size="20">REPORTED RANGE</text><text x="841" y="356" fill="#f3f0e9" font-size="31" font-weight="bold">0–150 kPa</text><text x="841" y="389" fill="#ffddca" font-size="18">compression</text><text x="841" y="435" fill="#f3f0e9" font-size="31" font-weight="bold">0–33 kPa</text><text x="841" y="468" fill="#ffddca" font-size="18">outward pull-off</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">Single-point prototype; arrays and stronger pull-off protection remain future work.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.36558v1. Original explanatory schematic.</text></g></svg>
