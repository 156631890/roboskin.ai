<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / HARDWARE EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="49" font-weight="bold">Seven axes, all linear</text><text x="62" y="189" fill="#abb5bd" font-size="27">Two stacked grippers separate holding from manipulation</text><rect x="70" y="250" width="630" height="260" rx="16" fill="#1d272f"/><rect x="202" y="286" width="356" height="76" rx="12" fill="#334651"/><rect x="202" y="398" width="356" height="76" rx="12" fill="#334651"/><rect x="126" y="303" width="122" height="42" rx="8" fill="#f3f0e9"/><rect x="512" y="303" width="122" height="42" rx="8" fill="#f3f0e9"/><rect x="126" y="415" width="122" height="42" rx="8" fill="#f3f0e9"/><rect x="512" y="415" width="122" height="42" rx="8" fill="#f3f0e9"/><g stroke="#f19a75" stroke-width="5"><path d="M130 278 H240"/><path d="M520 278 H630"/><path d="M130 500 H240"/><path d="M520 500 H630"/><path d="M380 365 V395"/></g><text x="756" y="283" fill="#f19a75" font-size="22">MECHANISM</text><text x="756" y="333" fill="#f3f0e9" font-size="30" font-weight="bold">4 fingertip slides</text><text x="756" y="375" fill="#f3f0e9" font-size="30" font-weight="bold">2 gripper openings</text><text x="756" y="417" fill="#f3f0e9" font-size="30" font-weight="bold">1 separation axis</text><text x="756" y="466" fill="#b8c2c9" font-size="21">35 objects · 350 configured trials</text><path d="M60 557 H1140" stroke="#49535c"/><text x="62" y="602" fill="#f3f0e9" font-size="24">Repeatable structured motion, without direct force or contact-location sensing.</text><text x="62" y="638" fill="#a6afb7" font-size="20">Source: arXiv:2609.25696v1. Original explanatory schematic.</text></g></svg>
