<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="137" fill="#f3f0e9" font-size="43" font-weight="bold">Fingertip signals speak at different times</text><text x="62" y="181" fill="#abb5bd" font-size="24">PROPRA anchors sparse sensors to state and future actions</text><rect x="60" y="236" width="310" height="246" rx="14" fill="#22333b"/><text x="90" y="280" fill="#f19a75" font-size="21">BEFORE CONTACT</text><text x="91" y="346" fill="#f3f0e9" font-size="34" font-weight="bold">Proximity</text><path d="M92 400 C145 330 215 460 332 350" fill="none" stroke="#f19a75" stroke-width="6"/><rect x="445" y="236" width="310" height="246" rx="14" fill="#283b41"/><text x="475" y="280" fill="#f19a75" font-size="21">CONTINUOUS ANCHOR</text><text x="475" y="344" fill="#f3f0e9" font-size="29" font-weight="bold">Robot state</text><text x="475" y="387" fill="#f3f0e9" font-size="29" font-weight="bold">Next 10 actions</text><rect x="830" y="236" width="310" height="246" rx="14" fill="#4e3027"/><text x="860" y="280" fill="#ffddca" font-size="21">AFTER CONTACT</text><text x="861" y="346" fill="#f3f0e9" font-size="34" font-weight="bold">Tactile</text><path d="M860 420 H1110" stroke="#ffddca" stroke-width="5"/><path d="M965 420 v-80 l25 80 25-55 25 55" fill="none" stroke="#f19a75" stroke-width="6"/><path d="M370 360 H445" stroke="#f19a75" stroke-width="5"/><path d="M755 360 H830" stroke="#f19a75" stroke-width="5"/><path d="M60 548 H1140" stroke="#49535c"/><text x="62" y="594" fill="#f3f0e9" font-size="24">75.0% average across four real-robot tasks; not best on every task.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.29822v1. Original explanatory schematic.</text></g></svg>
