<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="49" font-weight="bold">Touch2Robot: contact in the demo loop</text><text x="62" y="189" fill="#abb5bd" font-size="27">Human touch guides a simulated view of target-hand contact</text><rect x="60" y="260" width="250" height="210" rx="12" fill="#1d272f"/><text x="95" y="319" fill="#f19a75" font-size="24">HUMAN INPUT</text><text x="95" y="364" fill="#f3f0e9" font-size="27">hand motion</text><text x="95" y="402" fill="#f3f0e9" font-size="27">glove touch</text><text x="95" y="440" fill="#f3f0e9" font-size="27">object motion</text><path d="M326 363 H398 M382 347 L398 363 L382 379" fill="none" stroke="#f19a75" stroke-width="5"/><rect x="424" y="260" width="330" height="210" rx="12" fill="#283b41"/><text x="465" y="319" fill="#f19a75" font-size="24">RETARGET + SIMULATE</text><text x="465" y="370" fill="#f3f0e9" font-size="29">robot pose</text><text x="465" y="412" fill="#f3f0e9" font-size="29">predicted contact</text><path d="M770 363 H842 M826 347 L842 363 L826 379" fill="none" stroke="#f19a75" stroke-width="5"/><rect x="868" y="260" width="272" height="210" rx="12" fill="#4e3027"/><text x="905" y="319" fill="#ffddca" font-size="24">VISUAL FEEDBACK</text><text x="905" y="370" fill="#f3f0e9" font-size="29">human adapts</text><text x="905" y="412" fill="#f3f0e9" font-size="29">next motion</text><path d="M1004 486 C1004 535 600 535 600 486" fill="none" stroke="#f19a75" stroke-width="4"/><path d="M584 502 L600 486 L616 502" fill="none" stroke="#f19a75" stroke-width="4"/><path d="M60 568 H1140" stroke="#49535c"/><text x="62" y="610" fill="#f3f0e9" font-size="24">Feedback is visualized robot touch, not physical haptic feedback.</text><text x="62" y="642" fill="#a6afb7" font-size="20">Source: Touch2Robot v1. Original schematic; not a user-study image.</text></g></svg>
