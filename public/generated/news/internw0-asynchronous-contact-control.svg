<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#070f1b"/><path d="M60 72H1140" stroke="#39485e"/><text x="60" y="53" font-family="Arial, sans-serif" font-size="19" fill="#ffba99">ROBOSKIN.AI  /  RESEARCH EXPLAINED</text><text x="60" y="137" font-family="Arial, sans-serif" font-size="40" fill="#e8edf4">InternW0: prediction and action at different rates</text><text x="60" y="184" font-family="Arial, sans-serif" font-size="23" fill="#a9b7cb">Fresh observations update how cached video context guides the next action chunk.</text><rect x="60" y="235" width="326" height="285" rx="14" fill="#111c2b" stroke="#34445b"/><text x="84" y="279" font-family="Arial, sans-serif" font-size="25" fill="#ffba99">1 / Predict the future</text><text x="84" y="330" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Slower video expert</text><text x="84" y="367" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Longer-horizon context</text><text x="84" y="404" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Cache attention features</text><text x="84" y="441" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Refresh asynchronously</text><path d="M395 375h24m-8-8 8 8-8 8" fill="none" stroke="#ffba99" stroke-width="3"/><rect x="437" y="235" width="326" height="285" rx="14" fill="#111c2b" stroke="#34445b"/><text x="461" y="279" font-family="Arial, sans-serif" font-size="25" fill="#ffba99">2 / Adapt the context</text><text x="461" y="330" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Read current observations</text><text x="461" y="367" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Edit the cached context</text><text x="461" y="404" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Preserve predictive cues</text><text x="461" y="441" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Update for each chunk</text><path d="M772 375h24m-8-8 8 8-8 8" fill="none" stroke="#ffba99" stroke-width="3"/><rect x="814" y="235" width="326" height="285" rx="14" fill="#111c2b" stroke="#34445b"/><text x="838" y="279" font-family="Arial, sans-serif" font-size="25" fill="#ffba99">3 / Generate actions</text><text x="838" y="330" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Faster action expert</text><text x="838" y="367" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Contact-aware histories</text><text x="838" y="404" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Predict actions + feedback</text><text x="838" y="441" font-family="Arial, sans-serif" font-size="22" fill="#e8edf4">Execute action channels</text><text x="60" y="582" font-family="Arial, sans-serif" font-size="21" fill="#b9c7d9">60.73 ms: model-side action path on RTX 5090D. Asynchronous video generation is excluded.</text><text x="60" y="628" font-family="Arial, sans-serif" font-size="18" fill="#8393aa">Original editorial schematic · Based on arXiv v1 · Not experiment imagery</text></svg>