<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="60" y="62" font-size="22" fill="#f19a75">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" font-size="46" fill="#f3f0e9">ZeroTouch: learning to stop a grasp</text><text x="60" y="191" font-size="27" fill="#abb5bd">Measured training targets; predicted contact during deployment</text><rect x="60" y="255" width="510" height="282" rx="12" fill="#1d272f" stroke="#59636c"/><text x="86" y="302" font-size="26" fill="#f19a75">TRAINING</text><text x="86" y="356" font-size="28" fill="#f3f0e9">RGB + robot state</text><text x="86" y="404" font-size="28" fill="#f3f0e9">Tactile deformation + wrench</text><text x="86" y="452" font-size="28" fill="#f3f0e9">Successful-grasp force target</text><rect x="630" y="255" width="510" height="282" rx="12" fill="#1d272f" stroke="#59636c"/><text x="656" y="302" font-size="26" fill="#f19a75">DEPLOYMENT</text><text x="656" y="356" font-size="28" fill="#f3f0e9">RGB + gripper state + gravity</text><text x="656" y="404" font-size="28" fill="#f3f0e9">Predict current and target force</text><text x="656" y="452" font-size="28" fill="#f3f0e9">Stop closure at their crossing</text><path d="M60 587 H1140" stroke="#49535c"/><text x="60" y="632" font-size="21" fill="#a6afb7">Source: ZeroTouch v1. Conceptual diagram, not an experimental image.</text></g></svg>