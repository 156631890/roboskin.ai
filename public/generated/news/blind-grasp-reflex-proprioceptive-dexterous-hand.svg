<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="137" fill="#f3f0e9" font-size="43" font-weight="bold">See to reach, feel through joint error</text><text x="62" y="181" fill="#abb5bd" font-size="24">Blind Grasp Reflex separates visual approach from local hand control</text><rect x="60" y="232" width="295" height="255" rx="14" fill="#22333b"/><text x="88" y="275" fill="#f19a75" font-size="21">VISUAL REACH</text><circle cx="174" cy="350" r="44" fill="none" stroke="#f3f0e9" stroke-width="8"/><path d="M218 350h78m-20-18 20 18-20 18" fill="none" stroke="#f19a75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="449" fill="#abb5bd" font-size="21">Arm estimates object pose</text><path d="M355 359h72" stroke="#f19a75" stroke-width="5"/><path d="M427 359l-18-12v24z" fill="#f19a75"/><rect x="438" y="232" width="324" height="255" rx="14" fill="#283b41"/><text x="468" y="275" fill="#f19a75" font-size="21">JOINT TRACKING ERROR</text><path d="M500 388c26-82 57-82 83 0s57 82 83 0" fill="none" stroke="#f3f0e9" stroke-width="8"/><path d="M500 414h166" stroke="#77848d" stroke-width="3" stroke-dasharray="9 9"/><text x="472" y="449" fill="#f3f0e9" font-size="21">Command minus measured pose</text><path d="M762 359h72" stroke="#f19a75" stroke-width="5"/><path d="M834 359l-18-12v24z" fill="#f19a75"/><rect x="845" y="232" width="295" height="255" rx="14" fill="#4e3027"/><text x="875" y="275" fill="#ffddca" font-size="21">HAND-LOCAL REFLEX</text><path d="M928 405v-82m128 82v-82M928 323l36-36m92 36-36-36" fill="none" stroke="#f3f0e9" stroke-width="11" stroke-linecap="round"/><rect x="970" y="344" width="44" height="70" rx="9" fill="#f19a75"/><text x="880" y="449" fill="#ffddca" font-size="21">No fingertip tactile sensor</text><path d="M60 548h1080" stroke="#49535c"/><text x="62" y="594" fill="#f3f0e9" font-size="24">95% on 3,028 simulated objects • hardware evidence is qualitative</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.31323v1. Original explanatory schematic.</text></g></svg>
