<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#11161b"/>
  <g font-family="Arial, sans-serif">
    <text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text>
    <text x="60" y="140" fill="#f3f0e9" font-size="42" font-weight="bold">A membrane fills the gaps in a delta array</text>
    <text x="62" y="186" fill="#abb5bd" font-size="25">64 discrete tips become one continuous manipulation surface</text>
    <rect x="60" y="236" width="670" height="275" rx="16" fill="#22333b"/>
    <text x="91" y="280" fill="#f19a75" font-size="20">8 × 8 ARRAY · 192 DOF · 43.3 MM PITCH</text>
    <g fill="#55727d">
      <circle cx="115" cy="345" r="10"/><circle cx="190" cy="345" r="10"/><circle cx="265" cy="345" r="10"/><circle cx="340" cy="345" r="10"/><circle cx="415" cy="345" r="10"/><circle cx="490" cy="345" r="10"/><circle cx="565" cy="345" r="10"/><circle cx="640" cy="345" r="10"/>
      <circle cx="115" cy="430" r="10"/><circle cx="190" cy="430" r="10"/><circle cx="265" cy="430" r="10"/><circle cx="340" cy="430" r="10"/><circle cx="415" cy="430" r="10"/><circle cx="490" cy="430" r="10"/><circle cx="565" cy="430" r="10"/><circle cx="640" cy="430" r="10"/>
    </g>
    <path d="M92 377 C160 337 205 430 275 382 S390 341 454 387 S565 431 667 371" fill="none" stroke="#f19a75" stroke-width="10"/>
    <rect x="305" y="363" width="31" height="31" rx="4" fill="#ffe0cf" transform="rotate(15 320 378)"/>
    <text x="91" y="480" fill="#b8c2c9" font-size="18">15–90 mm objects on one 263 × 325 mm surface</text>
    <path d="M730 373 H790" stroke="#f19a75" stroke-width="6"/>
    <rect x="790" y="236" width="350" height="275" rx="16" fill="#4e3027"/>
    <text x="821" y="280" fill="#ffddca" font-size="20">LEARNED POLICY TRANSFER</text>
    <text x="821" y="360" fill="#f3f0e9" font-size="42" font-weight="bold">38 / 50</text>
    <text x="821" y="398" fill="#ffddca" font-size="22">physical successes</text>
    <text x="821" y="450" fill="#f3f0e9" font-size="24">19-delta local control</text>
    <text x="821" y="480" fill="#b8c2c9" font-size="18">without hardware adaptation</text>
    <path d="M60 554 H1140" stroke="#49535c"/>
    <text x="62" y="599" fill="#f3f0e9" font-size="23">The 15 mm demo uses scripted primitives; learned transfer covers 30–90 mm.</text>
    <text x="62" y="636" fill="#a6afb7" font-size="20">Source: arXiv:2609.39652v1. Original explanatory schematic.</text>
  </g>
