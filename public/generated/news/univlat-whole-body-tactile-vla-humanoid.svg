<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="43" font-weight="bold">Uni-VLaT gives humanoids whole-body touch</text><text x="62" y="189" fill="#abb5bd" font-size="26">Eight skin regions anchor future tactile, body and visual features</text><rect x="60" y="246" width="300" height="250" rx="16" fill="#22333b"/><text x="92" y="291" fill="#f19a75" font-size="20">WHOLE-BODY E-SKIN</text><circle cx="210" cy="345" r="36" fill="#718089"/><rect x="173" y="382" width="74" height="90" rx="25" fill="#718089"/><circle cx="173" cy="402" r="16" fill="#f19a75"/><circle cx="247" cy="402" r="16" fill="#f19a75"/><circle cx="183" cy="448" r="13" fill="#f19a75"/><circle cx="237" cy="448" r="13" fill="#f19a75"/><text x="92" y="477" fill="#b8c2c9" font-size="18">8 distributed regions</text><path d="M360 371 H420" stroke="#f19a75" stroke-width="6"/><rect x="420" y="246" width="300" height="250" rx="16" fill="#283b41"/><text x="452" y="291" fill="#f19a75" font-size="20">VLA ADAPTATION</text><text x="452" y="365" fill="#f3f0e9" font-size="30" font-weight="bold">touch + state</text><text x="452" y="406" fill="#f3f0e9" font-size="30" font-weight="bold">+ action</text><text x="452" y="458" fill="#b8c2c9" font-size="18">frozen vision-language model</text><path d="M720 371 H780" stroke="#f19a75" stroke-width="6"/><rect x="780" y="246" width="360" height="250" rx="16" fill="#4e3027"/><text x="812" y="291" fill="#ffddca" font-size="20">TRAINING PREDICTIONS</text><text x="812" y="354" fill="#f3f0e9" font-size="27" font-weight="bold">tactile · body · visual</text><text x="812" y="408" fill="#ffddca" font-size="24">75% average success</text><text x="812" y="454" fill="#ffddca" font-size="18">5 real-robot tasks · 20 trials each</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">Prediction heads train the policy; they are removed for deployment.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.35450v1. Original explanatory schematic.</text></g></svg>
