<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="137" fill="#f3f0e9" font-size="43" font-weight="bold">Keep the skill. Learn the correction.</text><text x="62" y="181" fill="#abb5bd" font-size="24">Res-HIL adds human-guided residual learning around a frozen policy</text><rect x="60" y="236" width="300" height="246" rx="14" fill="#22333b"/><text x="90" y="280" fill="#f19a75" font-size="21">FROZEN BASE</text><text x="90" y="349" fill="#f3f0e9" font-size="38" font-weight="bold">ACT policy</text><text x="90" y="400" fill="#abb5bd" font-size="22">20 demonstrations</text><text x="383" y="370" fill="#f19a75" font-size="48">+</text><rect x="445" y="236" width="310" height="246" rx="14" fill="#283b41"/><text x="475" y="280" fill="#f19a75" font-size="21">LEARNED RESIDUAL</text><text x="475" y="341" fill="#f3f0e9" font-size="31" font-weight="bold">TD3 correction</text><text x="475" y="385" fill="#f3f0e9" font-size="25">Human targets</text><text x="475" y="424" fill="#abb5bd" font-size="22">Reward shaping</text><path d="M755 361 H820" stroke="#f19a75" stroke-width="5"/><path d="M820 361 l-18-12 v24z" fill="#f19a75"/><rect x="830" y="236" width="310" height="246" rx="14" fill="#4e3027"/><text x="860" y="280" fill="#ffddca" font-size="21">FIVE CONDITIONS</text><text x="860" y="344" fill="#f3f0e9" font-size="34" font-weight="bold">100 / 96 / 100</text><text x="860" y="389" fill="#f3f0e9" font-size="34" font-weight="bold">88 / 100%</text><text x="860" y="429" fill="#ffddca" font-size="20">final reported success</text><path d="M60 548 H1140" stroke="#49535c"/><text x="62" y="594" fill="#f3f0e9" font-size="24">Human corrections supervise only the residual—not a new full policy.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.30023v1. Original explanatory schematic.</text></g></svg>
