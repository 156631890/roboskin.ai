<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / OPEN TOOL EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="49" font-weight="bold">DexTaG retargets touch, not just motion</text><text x="62" y="189" fill="#abb5bd" font-size="26">A tactile glove guides reinforcement-learning demonstration transfer</text><rect x="60" y="246" width="310" height="250" rx="16" fill="#22333b"/><text x="92" y="291" fill="#f19a75" font-size="20">TACTILE GLOVE</text><path d="M118 433 Q135 323 165 405 Q172 298 204 396 Q220 310 248 402 Q265 330 292 416" fill="none" stroke="#f3f0e9" stroke-width="15" stroke-linecap="round"/><circle cx="208" cy="430" r="56" fill="#718089"/><g fill="#f19a75"><circle cx="158" cy="361" r="8"/><circle cx="199" cy="337" r="8"/><circle cx="242" cy="356" r="8"/><circle cx="207" cy="420" r="8"/></g><text x="92" y="473" fill="#b8c2c9" font-size="18">24 × 32 pressure map</text><path d="M370 371 H430" stroke="#f19a75" stroke-width="6"/><rect x="430" y="246" width="310" height="250" rx="16" fill="#283b41"/><text x="462" y="291" fill="#f19a75" font-size="20">TACTILE-GUIDED RL</text><text x="462" y="356" fill="#f3f0e9" font-size="29" font-weight="bold">~700 sim points</text><text x="462" y="401" fill="#f3f0e9" font-size="29" font-weight="bold">teacher policies</text><text x="462" y="452" fill="#b8c2c9" font-size="18">then distill to a student</text><path d="M740 371 H800" stroke="#f19a75" stroke-width="6"/><rect x="800" y="246" width="340" height="250" rx="16" fill="#4e3027"/><text x="832" y="291" fill="#ffddca" font-size="20">RELEASE CHECK</text><text x="832" y="350" fill="#f3f0e9" font-size="27" font-weight="bold">code + demos</text><text x="832" y="394" fill="#f3f0e9" font-size="27" font-weight="bold">retargeters + MIT</text><text x="832" y="448" fill="#ffddca" font-size="18">real-robot controller not verified</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">The main baseline comparison uses unequal policy-training budgets.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.33882v1. Original explanatory schematic.</text></g></svg>
