<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">DexSuite: three evidence scopes</title><desc id="desc">Framework availability does not establish dataset readiness. Conceptual editorial framework, not an experiment.</desc><rect width="1200" height="720" fill="#09131f"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="65" fill="#91d8ad" font-size="22">ROBOSKIN / EVIDENCE REVIEW</text><text x="60" y="126" fill="#f4f6fa" font-size="42">DexSuite: three evidence scopes</text><text x="60" y="176" fill="#c1cedc" font-size="26">Framework availability does not establish dataset readiness</text><rect x="60" y="225" width="510" height="145" rx="16" fill="#132235" stroke="#415c78" stroke-width="2"/><text x="85" y="267" fill="#f4f6fa" font-size="30">FRAMEWORK</text><text x="85" y="308" fill="#c1cedc" font-size="25">Task + arm + end-effector</text><text x="85" y="342" fill="#c1cedc" font-size="25">Pin the software configuration</text><rect x="630" y="225" width="510" height="145" rx="16" fill="#132235" stroke="#415c78" stroke-width="2"/><text x="655" y="267" fill="#f4f6fa" font-size="30">BENCHMARK</text><text x="655" y="308" fill="#c1cedc" font-size="25">Task-embodiment pair</text><text x="655" y="342" fill="#c1cedc" font-size="25">Keep the evaluation protocol fixed</text><rect x="60" y="430" width="510" height="145" rx="16" fill="#132235" stroke="#415c78" stroke-width="2"/><text x="85" y="472" fill="#f4f6fa" font-size="30">DATASET SUBSET</text><text x="85" y="513" fill="#c1cedc" font-size="25">Schema + action layout + license</text><text x="85" y="547" fill="#c1cedc" font-size="25">Pin the data revision separately</text><rect x="630" y="430" width="510" height="145" rx="16" fill="#28392f" stroke="#90d6a9" stroke-width="2"/><text x="655" y="472" fill="#b4edc7" font-size="30">NEXT VERIFICATION</text><text x="655" y="513" fill="#c1cedc" font-size="25">Load and replay an episode</text><text x="655" y="547" fill="#c1cedc" font-size="25">Then test a matched policy baseline</text><text x="60" y="647" fill="#91a6ba" font-size="21">EDITORIAL FRAMEWORK  /  NO EXPERIMENTAL RESULT SHOWN</text></g></svg>