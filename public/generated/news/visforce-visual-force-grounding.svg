<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="49" font-weight="bold">VisForce grounds force in pixels</text><text x="62" y="189" fill="#abb5bd" font-size="26">Current and desired force cues meet through cross-attention</text><rect x="60" y="248" width="310" height="234" rx="14" fill="#22333b"/><text x="92" y="298" fill="#f19a75" font-size="21">CURRENT IMAGE</text><circle cx="165" cy="378" r="24" fill="#f3f0e9"/><circle cx="250" cy="350" r="24" fill="#f3f0e9"/><path d="M165 367 v-74" stroke="#f19a75" stroke-width="8"/><path d="M165 290 l-12 22 h24z" fill="#f19a75"/><path d="M250 339 v-48" stroke="#f19a75" stroke-width="8"/><path d="M250 288 l-12 22 h24z" fill="#f19a75"/><text x="92" y="450" fill="#b8c2c9" font-size="20">actuator-force cues</text><rect x="418" y="248" width="310" height="234" rx="14" fill="#283b41"/><text x="450" y="298" fill="#f19a75" font-size="21">DESIRED IMAGE</text><rect x="495" y="340" width="150" height="72" rx="36" fill="#6f7e86"/><path d="M570 360 v-64" stroke="#f19a75" stroke-width="8"/><path d="M570 293 l-12 22 h24z" fill="#f19a75"/><text x="450" y="450" fill="#b8c2c9" font-size="20">segmented goal + force</text><path d="M370 365 H410 M728 365 H768" stroke="#f19a75" stroke-width="5"/><rect x="776" y="248" width="364" height="234" rx="14" fill="#4e3027"/><text x="808" y="298" fill="#ffddca" font-size="21">CROSS-ATTENTION</text><text x="808" y="357" fill="#f3f0e9" font-size="31" font-weight="bold">force-aware action</text><text x="808" y="405" fill="#ffddca" font-size="20">70% · 55% · 40%</text><text x="808" y="440" fill="#ffddca" font-size="20">three multi-stage tasks</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">