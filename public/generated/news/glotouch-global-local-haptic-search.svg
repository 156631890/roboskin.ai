<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="47" font-weight="bold">One gripper, two scales of touch</text><text x="62" y="189" fill="#abb5bd" font-size="26">GLoTouch searches globally, then matches geometry locally</text><rect x="60" y="252" width="318" height="218" rx="14" fill="#22333b"/><text x="92" y="302" fill="#f19a75" font-size="21">GLOBAL SEARCH</text><path d="M105 385 C155 315 255 435 330 340" fill="none" stroke="#f19a75" stroke-width="6"/><circle cx="330" cy="340" r="12" fill="#f19a75"/><text x="92" y="428" fill="#b8c2c9" font-size="21">passive probe + wrist wrench</text><path d="M378 361 H438" stroke="#f19a75" stroke-width="5"/><path d="M438 361 l-18-12 v24z" fill="#f19a75"/><rect x="448" y="252" width="304" height="218" rx="14" fill="#283b41"/><text x="480" y="302" fill="#f19a75" font-size="21">LOCAL MATCH</text><path d="M515 350 h58 v70 h-58z M627 350 h58 v70 h-58z" fill="none" stroke="#f3f0e9" stroke-width="7"/><circle cx="600" cy="385" r="34" fill="#f19a75" opacity=".85"/><text x="480" y="448" fill="#b8c2c9" font-size="21">bilateral tactile depth + STL</text><path d="M752 361 H812" stroke="#f19a75" stroke-width="5"/><path d="M812 361 l-18-12 v24z" fill="#f19a75"/><rect x="822" y="252" width="318" height="218" rx="14" fill="#4e3027"/><text x="854" y="302" fill="#ffddca" font-size="21">RETRIEVE</text><text x="854" y="363" fill="#f3f0e9" font-size="36" font-weight="bold">38 / 50</text><text x="854" y="405" fill="#ffddca" font-size="21">real-robot trials</text><text x="854" y="438" fill="#ffddca" font-size="21">five-object scenes</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">Long-range contact finds candidates; fingertip geometry chooses the target.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.27695v1. Original explanatory schematic.</text></g></svg>
