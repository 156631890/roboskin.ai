<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / SENSOR EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="49" font-weight="bold">TacGooseBumps makes shear visible</text><text x="62" y="189" fill="#abb5bd" font-size="26">A passive domed film reshapes readings from a pressure array</text><rect x="60" y="246" width="330" height="250" rx="16" fill="#22333b"/><text x="92" y="291" fill="#f19a75" font-size="20">STANDARD ARRAY</text><g fill="#718089"><circle cx="135" cy="360" r="18"/><circle cx="195" cy="360" r="18"/><circle cx="255" cy="360" r="18"/><circle cx="315" cy="360" r="18"/><circle cx="135" cy="420" r="18"/><circle cx="195" cy="420" r="18"/><circle cx="255" cy="420" r="18"/><circle cx="315" cy="420" r="18"/></g><text x="92" y="473" fill="#b8c2c9" font-size="18">unchanged electronics</text><path d="M390 371 H440" stroke="#f19a75" stroke-width="6"/><rect x="440" y="246" width="300" height="250" rx="16" fill="#283b41"/><text x="472" y="291" fill="#f19a75" font-size="20">ELASTOMER DOMES</text><path d="M485 410 Q515 335 545 410 Q575 320 605 410 Q635 342 665 410" fill="none" stroke="#f3f0e9" stroke-width="15" stroke-linecap="round"/><path d="M505 442 H670" stroke="#718089" stroke-width="20"/><path d="M515 330 H665" stroke="#f19a75" stroke-width="6"/><path d="M665 330 l-20 -13 v26z" fill="#f19a75"/><text x="472" y="473" fill="#b8c2c9" font-size="18">shear-dependent patterns</text><path d="M740 371 H790" stroke="#f19a75" stroke-width="6"/><rect x="790" y="246" width="350" height="250" rx="16" fill="#4e3027"/><text x="822" y="291" fill="#ffddca" font-size="20">POLICY OUTCOMES</text><text x="822" y="352" fill="#f3f0e9" font-size="27" font-weight="bold">24 / 25 bulb trials</text><text x="822" y="398" fill="#f3f0e9" font-size="27" font-weight="bold">66% lower peak load</text><text x="822" y="448" fill="#ffddca" font-size="18">task-specific experiments</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">The film adds useful patterns, not calibrated shear vectors.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.34006v1. Original explanatory schematic.</text></g></svg>
