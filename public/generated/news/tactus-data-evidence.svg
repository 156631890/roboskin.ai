<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">From human touch to robot evidence</title><desc id="desc">A proposed evaluation path for demonstration data. Conceptual editorial framework, not an experiment.</desc><rect width="1200" height="720" fill="#09131f"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="65" fill="#91d8ad" font-size="22">ROBOSKIN / EVIDENCE REVIEW</text><text x="60" y="126" fill="#f4f6fa" font-size="42">From human touch to robot evidence</text><text x="60" y="176" fill="#c1cedc" font-size="26">A proposed evaluation path for demonstration data</text><rect x="60" y="225" width="510" height="145" rx="16" fill="#132235" stroke="#415c78" stroke-width="2"/><text x="85" y="267" fill="#f4f6fa" font-size="30">CONTACT MEASUREMENT</text><text x="85" y="308" fill="#c1cedc" font-size="25">Reference load + calibration</text><text x="85" y="342" fill="#c1cedc" font-size="25">Retain session and sensor identity</text><rect x="630" y="225" width="510" height="145" rx="16" fill="#132235" stroke="#415c78" stroke-width="2"/><text x="655" y="267" fill="#f4f6fa" font-size="30">HAND POSE</text><text x="655" y="308" fill="#c1cedc" font-size="25">Coordinate frame + timing</text><text x="655" y="342" fill="#c1cedc" font-size="25">Separate causal and offline estimates</text><rect x="60" y="430" width="510" height="145" rx="16" fill="#132235" stroke="#415c78" stroke-width="2"/><text x="85" y="472" fill="#f4f6fa" font-size="30">EPISODE RECORD</text><text x="85" y="513" fill="#c1cedc" font-size="25">Align observations and labels</text><text x="85" y="547" fill="#c1cedc" font-size="25">Inspect gaps and held-out sessions</text><rect x="630" y="430" width="510" height="145" rx="16" fill="#28392f" stroke="#90d6a9" stroke-width="2"/><text x="655" y="472" fill="#b4edc7" font-size="30">ROBOT TRANSFER TEST</text><text x="655" y="513" fill="#c1cedc" font-size="25">Match task, hardware and budget</text><text x="655" y="547" fill="#c1cedc" font-size="25">Measure the effect of tactile input</text><text x="60" y="647" fill="#91a6ba" font-size="21">EDITORIAL FRAMEWORK  /  NO EXPERIMENTAL RESULT SHOWN</text></g></svg>