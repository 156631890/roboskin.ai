<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#11161b"/><g font-family="Arial, sans-serif"><text x="62" y="61" fill="#f19a75" font-size="23" letter-spacing="3">ROBOSKIN.AI / RESEARCH EXPLAINED</text><text x="60" y="143" fill="#f3f0e9" font-size="47" font-weight="bold">Contact from the torque residual</text><text x="62" y="189" fill="#abb5bd" font-size="26">CoPRE learns free motion, then preserves the unexpected difference</text><rect x="60" y="252" width="300" height="218" rx="14" fill="#22333b"/><text x="92" y="302" fill="#f19a75" font-size="21">LEARN FREE MOTION</text><path d="M92 390 C135 350 174 422 214 365 S295 408 328 340" fill="none" stroke="#7fc1c8" stroke-width="6"/><text x="92" y="438" fill="#b8c2c9" font-size="21">states + commands</text><path d="M360 361 H430" stroke="#f19a75" stroke-width="5"/><path d="M430 361 l-18-12 v24z" fill="#f19a75"/><rect x="440" y="252" width="320" height="218" rx="14" fill="#283b41"/><text x="472" y="302" fill="#f19a75" font-size="21">COMPARE RESPONSE</text><path d="M480 360 H720 M480 400 C525 380 550 430 590 378 S670 425 720 350" fill="none" stroke="#f3f0e9" stroke-width="5"/><text x="472" y="438" fill="#b8c2c9" font-size="21">noise-weighted Jacobian score</text><path d="M760 361 H830" stroke="#f19a75" stroke-width="5"/><path d="M830 361 l-18-12 v24z" fill="#f19a75"/><rect x="840" y="252" width="300" height="218" rx="14" fill="#4e3027"/><text x="872" y="302" fill="#ffddca" font-size="21">REACT</text><text x="872" y="360" fill="#f3f0e9" font-size="34" font-weight="bold">stop · retreat</text><text x="872" y="403" fill="#ffddca" font-size="21">adjust · retry</text><text x="872" y="438" fill="#ffddca" font-size="21">event, not force map</text><path d="M60 550 H1140" stroke="#49535c"/><text x="62" y="595" fill="#f3f0e9" font-size="24">No force labels—yet each robot still needs its own calibration.</text><text x="62" y="632" fill="#a6afb7" font-size="20">Source: arXiv:2609.27381v1. Original explanatory schematic.</text></g></svg>
